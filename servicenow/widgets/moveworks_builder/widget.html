<div class="mwb-container">
  <div class="mwb-header">
    <h2>Moveworks Object Builder</h2>
    <p class="mwb-subtitle">Describe the Moveworks object you need and Claude will build it for you.</p>
  </div>

  <div class="mwb-form">
    <div class="form-group">
      <label for="mwb-request">Your Request</label>
      <textarea
        id="mwb-request"
        class="form-control mwb-textarea"
        ng-model="c.data.userRequest"
        placeholder="e.g. Create an action to reset a user's password and send a notification email"
        rows="4">
      </textarea>
    </div>

    <div class="form-group">
      <label>Object Type</label>
      <div class="mwb-type-selector">
        <button class="btn mwb-type-btn" ng-class="{'active': c.data.objectType === 'action'}"   ng-click="c.data.objectType = 'action'">  Action  </button>
        <button class="btn mwb-type-btn" ng-class="{'active': c.data.objectType === 'event'}"    ng-click="c.data.objectType = 'event'">   Event   </button>
        <button class="btn mwb-type-btn" ng-class="{'active': c.data.objectType === 'slot'}"     ng-click="c.data.objectType = 'slot'">    Slot    </button>
      </div>
    </div>

    <button class="btn btn-primary mwb-build-btn"
            ng-click="c.buildObject()"
            ng-disabled="c.data.loading || !c.data.userRequest">
      <span ng-if="!c.data.loading">⚡ Build Object</span>
      <span ng-if="c.data.loading">Building...</span>
    </button>
  </div>

  <!-- Error -->
  <div class="mwb-error" ng-if="c.data.error">
    <strong>Error:</strong> {{c.data.error}}
  </div>

  <!-- Result -->
  <div class="mwb-result" ng-if="c.data.result">
    <div class="mwb-result-header">
      <h4>Generated Moveworks Object</h4>
      <div class="mwb-badges">
        <span class="badge mwb-badge-type">{{c.data.result.type}}</span>
        <span class="badge mwb-badge-id">{{c.data.result.id}}</span>
      </div>
    </div>
    <pre class="mwb-json">{{c.data.resultJson}}</pre>

    <div class="mwb-actions">
      <button class="btn btn-success" ng-click="c.saveObject()">💾 Save to ServiceNow</button>
      <button class="btn btn-default" ng-click="c.copyJson()">📋 Copy JSON</button>
      <button class="btn btn-default" ng-click="c.reset()">🔄 New Object</button>
    </div>

    <div class="mwb-saved-msg" ng-if="c.data.saved">
      ✅ Object saved! <a ng-href="/x_mwb_mw_object.do?sys_id={{c.data.savedSysId}}">View record</a>
    </div>
  </div>
</div>
